<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>かんたん しつもん</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="home" class="screen home">
    <header class="brand"><h1>かんたん　しつもん</h1><p>せっていを　えらんでください</p></header>
    <section class="settings">
      <fieldset><legend>しつもんの　カテゴリー</legend><div id="categories" class="choice-grid categories"></div></fieldset>
      <div class="setting-row">
        <fieldset><legend>レベル</legend><div class="choice-grid three" id="levels"></div></fieldset>
        <fieldset><legend>対訳</legend><div class="choice-grid two" id="translationMode"></div></fieldset>
      </div>
      <div id="translationSettings" class="setting-row hidden">
        <label>国<select id="country"><option value="">えらんでください</option></select></label>
        <label id="languageWrap" class="hidden">言語<select id="language"></select></label>
      </div>
    </section>
    <button id="start" class="primary start" disabled>スタート</button>
  </main>

  <main id="quiz" class="screen quiz hidden">
    <header class="quiz-header">
      <div id="status"></div>
      <div><button id="fullscreen" class="utility">全画面</button><button id="homeBtn" class="utility">ホーム</button></div>
    </header>
    <section class="stage" aria-live="polite">
      <div id="question" class="question"></div>
      <div id="translation" class="translation hidden"></div>
      <div id="translationNotice" class="notice hidden">この言語の対訳は準備中です</div>
      <div id="answers" class="answers hidden"><div class="answer-title">こたえの　れい</div><div id="answerList"></div></div>
      <button id="followup" class="followup hidden">つづきの質問</button>
    </section>
    <footer class="controls">
      <button id="toggleTranslation">対訳を表示</button>
      <button id="toggleAnswers">回答例を表示</button>
      <button id="prev">前へ</button>
      <button id="next" class="primary">次の質問</button>
    </footer>
  </main>

  <dialog id="homeDialog"><h2>ホーム画面に戻りますか？</h2><p>いまの質問の進み方は終了します。</p><div><button id="cancelHome">キャンセル</button><button id="confirmHome" class="primary">ホームへ戻る</button></div></dialog>
  <dialog id="endDialog"><h2>この範囲の質問は<br>すべて終わりました</h2><div><button id="endHome">ホーム</button><button id="restart" class="primary">もう一度</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
