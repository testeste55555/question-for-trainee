<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>かんたん しつもん</title>
  <link rel="stylesheet" href="styles.css">
  <style>.choice-grid.categories{grid-template-columns:repeat(4,1fr)}</style>
</head>
<body>
  <main id="home" class="screen home">
    <header class="brand"><h1>かんたん　しつもん</h1><p>せっていを　えらんでください</p></header>
    <section class="settings">
      <fieldset><legend><span>1</span> カテゴリー</legend><div id="categories" class="choice-grid categories"></div></fieldset>
      <fieldset class="level-field"><legend><span>2</span> レベル</legend><div class="choice-grid three" id="levels"></div></fieldset>
    </section>
    <button id="start" class="primary start" disabled>スタート</button>
  </main>

  <main id="quiz" class="screen quiz hidden">
    <header class="quiz-header">
      <button id="homeBtn" class="utility">⌂ ホーム</button>
      <div id="status"></div>
      <div><span id="progress"></span><button id="fullscreen" class="utility">全画面</button></div>
    </header>
    <section class="stage" aria-live="polite">
      <div id="question" class="question"></div>
      <div id="translation" class="translation hidden"></div>
      <div id="translationNotice" class="notice hidden">この質問の対訳は準備中です</div>
      <div id="answers" class="answers hidden"><div class="answer-title">こたえの　れい</div><div id="answerList"></div></div>
      <button id="followup" class="followup hidden">つづきの質問</button>
    </section>
    <footer class="controls">
      <div id="translationControl" class="translation-control">
        <div class="split-action">
          <button id="toggleTranslation" aria-pressed="false"><span class="action-key">T</span><span id="translationLabel">対訳を選ぶ</span></button>
          <button id="languageMenuToggle" class="language-menu-toggle" aria-label="対訳の言語を変更" aria-haspopup="menu" aria-expanded="false">▼</button>
        </div>
        <div id="languageMenu" class="language-menu hidden" role="menu" aria-label="対訳の言語">
          <p>対訳の言語</p>
          <div id="languageOptions"></div>
        </div>
      </div>
      <button id="toggleAnswers"><span class="action-key">A</span>回答例を表示</button>
      <button id="prev">← 前へ</button>
      <button id="next" class="primary">次の質問 →</button>
    </footer>
  </main>

  <dialog id="homeDialog"><h2>ホーム画面に戻りますか？</h2><p>いまの質問の進み方は終了します。</p><div><button id="cancelHome">キャンセル</button><button id="confirmHome" class="primary">ホームへ戻る</button></div></dialog>
  <dialog id="endDialog"><h2>この範囲の質問は<br>すべて終わりました</h2><div><button id="endHome">ホーム</button><button id="restart" class="primary">もう一度</button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
